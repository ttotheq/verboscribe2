[package]
name = "verboscribe2-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "verboscribe2_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["image-png", "tray-icon"] }
verboscribe-audio = { path = "../../../crates/verboscribe-audio" }
verboscribe-core = { path = "../../../crates/verboscribe-core" }
verboscribe-platform = { path = "../../../crates/verboscribe-platform" }
verboscribe-storage = { path = "../../../crates/verboscribe-storage" }
verboscribe-transcription = { path = "../../../crates/verboscribe-transcription" }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
